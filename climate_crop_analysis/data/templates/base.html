<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>ClimateCrop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
    }
    .navbar, .card, .form-control, .table {
      background-color: #1e1e1e;
      color: #e0e0e0;
    }
    .form-control, .btn {
      border: 1px solid #444;
    }
    .btn-primary {
      background-color: #0066cc;
      border-color: #0066cc;
    }
    .table th, .table td {
      color: #e0e0e0;
    }
    .alert {
      background-color: #333;
      color: #fff;
    }
    select, input {
      background-color: #2b2b2b;
      color: #e0e0e0;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="{% url 'index' %}">🌾 ClimateCrop</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'upload' %}">Імпорт</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'analytics' %}">Аналітика</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'predict' %}">Прогноз</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'ml' %}">ML</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'map' %}">MAP</a></li>
        </ul>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}
  {% block extra_js %}{% endblock %}
</body>
</html>
