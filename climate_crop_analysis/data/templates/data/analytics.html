{% extends "base.html" %}
{% block content %}
  <div class="container mt-5 text-center">
    <h2>Аналітика урожайності</h2>

    {% if error %}
      <p>{{ error }}</p>
    {% else %}

      <form method="get" class="row justify-content-center mt-4 g-2">
        <div class="col-auto">
          <label for="scale">Масштаб років:</label>
          <select name="scale" id="scale" class="form-select" onchange="this.form.submit()">
            {% for s in scale_options %}
              <option value="{{ s }}" {% if scale == s %}selected{% endif %}>{{ s }} років</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-auto">
          <label for="region">Регіон:</label>
          <select name="region" id="region" class="form-select" onchange="this.form.submit()">
            <option value="">Усі</option>
            {% for r in regions %}
              <option value="{{ r }}" {% if r == selected_region %}selected{% endif %}>{{ r }}</option>
            {% endfor %}
          </select>
        </div>
      </form>

      <img src="data:image/png;base64,{{ chart }}" class="img-fluid mt-4">
      <a class="btn btn-outline-secondary mt-4" href="{% url 'export' %}">⬇️ Експортувати CSV</a>
    {% endif %}
  </div>
{% endblock %}
