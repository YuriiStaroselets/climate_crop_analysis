{% extends "base.html" %}
{% block content %}
  <div class="container mt-5">
    <h2>Завантаження даних</h2>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <div class="mb-3">
        <input type="file" name="csv_file" class="form-control" required>
      </div>
      <button class="btn btn-primary">Завантажити</button>
    </form>
  </div>
{% endblock %}
